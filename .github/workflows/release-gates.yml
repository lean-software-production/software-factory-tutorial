name: Release gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tutorial-engine:
    name: Tutorial engine release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run --workspace=tutorial-engine browser:install:ci
      - run: npm run --workspace=tutorial-engine build
      - run: npm run --workspace=tutorial-engine check
